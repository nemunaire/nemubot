---
kind: pipeline
type: docker
name: default

platform:
  os: linux
  arch: arm

steps:
  - name: build
    image: python:alpine
    commands:
      - pip install --no-cache-dir -r requirements.txt
      - pip install .

  - name: docker
    image: plugins/docker:linux-arm
    settings:
      repo: nemunaire/nemubot
      auto_tag: true
      auto_tag_suffix: ${DRONE_STAGE_OS}-${DRONE_STAGE_ARCH}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
